<text x="596" y="300" font-size="11" fill="#514c45">· 单应矩阵 / 内点数</text>
<text x="850" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1c1a">对外形态</text>
<text x="802" y="140" font-size="11" fill="#514c45">REST /api</text>
<text x="802" y="164" font-size="11" fill="#514c45">MCP /mcp</text>
<text x="802" y="188" font-size="11" fill="#514c45">CLI citybible</text>
<text x="802" y="212" font-size="11" fill="#514c45">展示页 web</text>
<text x="802" y="248" font-size="10" fill="#8a8178">Streamable</text>
<text x="802" y="264" font-size="10" fill="#8a8178">HTTP 2025-11-25</text>
<text x="470" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1c1a">裁判校准器 —— 凭什么信它判得准</text>
<text x="60" y="410" font-size="11" fill="#514c45">POS 同一物理场景（受控视角/光照变换，HPatches 式构造） 48 条</text>
<text x="60" y="430" font-size="11" fill="#514c45">NEG-A 完全异景 4 条　NEG-C 跨地标冒充 12 条</text>
<text x="60" y="450" font-size="11" fill="#a8322a">NEG-B AI 重新生成的同名地点 4 条 —— 最难也最关键的一类</text>
<text x="560" y="410" font-size="11" fill="#514c45">输出：混淆矩阵 / 查准率 / 查全率 / F1 / 误杀率 / 漏放率</text>
<text x="560" y="430" font-size="11" fill="#514c45">三检测器均 68/68，F1 = 1.000</text>
<text x="560" y="450" font-size="11" fill="#2f6f5e">正负内点数相差 200 倍，阈值不敏感</text>
