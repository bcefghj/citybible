<text x="46" y="268" font-size="11" fill="#514c45">· AI 生成图 / 短视频帧</text>
<text x="46" y="288" font-size="11" fill="#514c45">· 声称的地点名</text>
<text x="46" y="308" font-size="11" fill="#514c45">· 上传或 API 传入</text>
<text x="405" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#a8322a">地理真实性判定引擎</text>
<text x="306" y="136" font-size="11.5" font-weight="700" fill="#1e1c1a">轨一 · 主判定（零 LLM）</text>
<text x="306" y="156" font-size="10.5" fill="#514c45">ORB/AKAZE/SIFT 特征点</text>
<text x="306" y="174" font-size="10.5" fill="#514c45">→ Lowe's ratio test</text>
<text x="306" y="192" font-size="10.5" fill="#514c45">→ RANSAC 单应矩阵校验</text>
<text x="306" y="210" font-size="10.5" fill="#514c45">→ 内点数 / 内点率</text>
<line x1="306" y1="224" x2="504" y2="224" stroke="#ddd4c4"/>
