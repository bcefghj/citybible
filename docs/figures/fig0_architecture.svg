<text x="46" y="132" font-size="11" fill="#514c45">· 多方位 / 多时段参考照</text>
<text x="46" y="152" font-size="11" fill="#514c45">· 来源与授权状态登记</text>
<text x="46" y="172" font-size="11" fill="#514c45">· 地方志 / 非遗档案</text>
