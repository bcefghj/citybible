<text x="306" y="310" font-size="10.5" fill="#514c45">仅灰区调用多模态模型</text>
<text x="655" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1c1a">四态门禁</text>
<text x="596" y="134" font-size="11" fill="#2f6f5e">✓ match　　通过</text>
<text x="596" y="154" font-size="11" fill="#a8322a">✕ mismatch　打回</text>
<text x="596" y="174" font-size="11" fill="#b5822b">⚠ needs_human_review</text>
<text x="655" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1c1a">证据链</text>
<text x="596" y="260" font-size="11" fill="#514c45">· 匹配点连线图</text>
